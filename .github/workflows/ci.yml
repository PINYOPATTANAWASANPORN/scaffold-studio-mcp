name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --ignore-scripts --no-frozen-lockfile
      - run: pnpm build:bindings
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
